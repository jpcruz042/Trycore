services:
  postgres:
    image: postgres:16-alpine
    container_name: trycore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trycore}
      POSTGRES_USER: ${POSTGRES_USER:-trycore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trycore_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - trycore-postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trycore} -d ${POSTGRES_DB:-trycore}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trycore-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trycore}:${POSTGRES_PASSWORD:-trycore_password}@postgres:5432/${POSTGRES_DB:-trycore}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trycore-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  trycore-postgres-data:
